status: Active
ala:
  class_asserted_in: AlaLocationInterpreter
  method_asserted_by: interpretCoordinateUncertaintyInMeters
  assertion_logic: dwc:coordinateUncertainty null or empty && dwc:coordinatePrecision > 1
recommendation: Remove
actions: This is a poorly conceived assertion, as it is more a suggestion as to why a value for dwc:coordinatePrecision might be invalid. A value higher than 1 for dwc:coordinatePrecision can just as easily have come from, e.g., dwc:minimumElevationInMeters. Replace with COORDINATE_PRECISION_INVALID assertion that is independent of dwc:coordinateUncertaintyInMeters.
